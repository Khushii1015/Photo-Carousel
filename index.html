<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Power of Sequencing</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-reunion">

  <h1>The Power of Sequencing</h1>

  <nav class="version-toggle"> <!-- Buttons that switch between the two stories -->
    <button class="version-btn active" data-sequence="reunion">A: The Reunion</button>
    <button class="version-btn" data-sequence="strangers">B: Strangers to Friends</button>
  </nav>

  <main class="stage">
    <figure class="frame">
      <img id="stage-image" src="images/selfie.jpg" alt=""> <!-- Click the image to go to the next part -->
      <span id="act-badge" class="act-badge">Beginning</span>
    </figure>

    <section class="story">
      <h2 id="sequence-title">The Reunion</h2>
      <p id="caption" class="caption"></p>
      <button id="prev-btn">Back</button>
      <button id="next-btn" class="primary">Next</button>
      <p class="hint">Tip: click the image to continue.</p>
    </section>
  </main>

  <section class="filmstrip-wrap">
    <h3>Sequence order</h3>
    <ol id="filmstrip" class="filmstrip"></ol> <!-- Thumbnails are added here by script.js -->
  </section>

  <script src="script.js"></script>
</body>
</html>
