<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Power of Sequencing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-reunion">

  <header class="intro">
    <p class="eyebrow">Same three images · Different order · Different story</p>
    <h1>The Power of Sequencing</h1>
  </header>

  <!-- Version toggle: switches which sequence (narrative) is shown -->
  <nav class="version-toggle" aria-label="Choose a sequence">
    <button class="version-btn" data-sequence="reunion" aria-pressed="true">
      <span class="version-letter">A</span> The Reunion
    </button>
    <button class="version-btn" data-sequence="strangers" aria-pressed="false">
      <span class="version-letter">B</span> Strangers to Friends
    </button>
  </nav>

  <main class="stage">
    <!-- Main image: click it to advance the story -->
    <figure class="frame">
      <img id="stage-image" src="images/selfie.jpg" alt="" title="Click to continue">
      <span id="act-badge" class="act-badge">Beginning</span>
    </figure>

    <section class="story">
      <p id="step-count" class="step-count">1 of 3</p>
      <h2 id="sequence-title">The Reunion</h2>
      <p id="caption" class="caption" aria-live="polite"></p>

      <div class="controls">
        <button id="prev-btn" class="ctrl">← Back</button>
        <button id="next-btn" class="ctrl ctrl-primary">Next →</button>
        <button id="play-btn" class="ctrl ctrl-ghost">▶ Play</button>
      </div>
      <p class="hint">Tip: click the image, or use the ← → arrow keys.</p>
    </section>
  </main>

  <!-- Filmstrip: rebuilt by JavaScript every time the sequence changes -->
  <section class="filmstrip-wrap">
    <h3>Sequence order</h3>
    <ol id="filmstrip" class="filmstrip"></ol>
  </section>

  <script src="script.js"></script>
</body>
</html>
