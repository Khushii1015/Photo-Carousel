<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="lamp" cx="22%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffe9c2"/>
      <stop offset="1" stop-color="#e6c9a1"/>
    </radialGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2b44"/>
      <stop offset="1" stop-color="#3b4e72"/>
    </linearGradient>
  </defs>

  <!-- warm interior wall -->
  <rect width="800" height="600" fill="url(#lamp)"/>
  <!-- floor -->
  <rect y="478" width="800" height="122" fill="#b07f58"/>
  <rect y="478" width="800" height="8" fill="#956a48"/>

  <!-- open front door showing the night outside -->
  <rect x="285" y="80" width="230" height="400" fill="#7a4e33"/>
  <rect x="300" y="95" width="200" height="385" fill="url(#night)"/>
  <circle cx="335" cy="140" r="2.5" fill="#fff" opacity=".8"/>
  <circle cx="470" cy="120" r="2" fill="#fff" opacity=".7"/>
  <circle cx="440" cy="175" r="1.8" fill="#fff" opacity=".6"/>
  <circle cx="320" cy="210" r="1.6" fill="#fff" opacity=".6"/>
  <!-- door swung open -->
  <polygon points="500,95 560,110 560,465 500,480" fill="#5f7a65"/>
  <circle cx="548" cy="290" r="5" fill="#e0a458"/>

  <!-- floor lamp -->
  <rect x="128" y="190" width="6" height="290" fill="#5b4636"/>
  <path d="M95 190 L167 190 L150 140 L112 140 Z" fill="#e0a458"/>
  <ellipse cx="131" cy="480" rx="30" ry="6" fill="#5b4636"/>
  <!-- small side table + plant -->
  <rect x="640" y="380" width="90" height="10" fill="#7a4e33"/>
  <rect x="650" y="390" width="8" height="90" fill="#7a4e33"/>
  <rect x="712" y="390" width="8" height="90" fill="#7a4e33"/>
  <path d="M668 380 L702 380 L697 350 L673 350 Z" fill="#c8553d"/>
  <path d="M685 350 C670 320 660 315 650 300 M685 350 C690 315 700 305 715 295 M685 350 C684 325 686 310 683 290" stroke="#6f8f72" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- shadow under the pair -->
  <ellipse cx="400" cy="482" rx="130" ry="10" fill="#000" opacity=".15"/>

  <!-- person on the left: terracotta coat -->
  <path d="M318 480 L322 300 Q326 262 372 258 L404 262 L404 480 Z" fill="#c8553d"/>
  <rect x="330" y="470" width="28" height="12" rx="4" fill="#3a2a22"/>
  <rect x="368" y="470" width="28" height="12" rx="4" fill="#3a2a22"/>
  <circle cx="374" cy="222" r="33" fill="#d9a07a"/>
  <path d="M341 218 Q340 180 378 184 Q408 186 406 214 Q392 198 372 200 Q352 204 341 218 Z" fill="#3a2a22"/>

  <!-- person on the right: blue sweater, leaning in -->
  <path d="M482 480 L478 300 Q474 264 432 258 L398 262 L398 480 Z" fill="#2b3a55"/>
  <rect x="404" y="470" width="28" height="12" rx="4" fill="#1b1b1b"/>
  <rect x="444" y="470" width="28" height="12" rx="4" fill="#1b1b1b"/>
  <circle cx="428" cy="218" r="32" fill="#a8714f"/>
  <path d="M396 214 Q392 178 430 180 Q466 182 462 222 Q462 240 456 250 Q452 214 430 202 Q410 196 396 214 Z" fill="#1b1b1b"/>

  <!-- arms wrapped around each other -->
  <path d="M392 300 Q440 288 474 318" stroke="#c8553d" stroke-width="24" fill="none" stroke-linecap="round"/>
  <circle cx="474" cy="320" r="11" fill="#d9a07a"/>
  <path d="M410 336 Q362 326 330 350" stroke="#2b3a55" stroke-width="24" fill="none" stroke-linecap="round"/>
  <circle cx="330" cy="352" r="11" fill="#a8714f"/>
</svg>
